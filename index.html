<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GramSetu — Connecting Villages to Government Services</title>
    <meta name="description" content="GramSetu is a digital platform connecting rural citizens to government schemes, market prices, announcements and a complaint portal. Built for India's villages." />
    <meta property="og:title" content="GramSetu — Village Bridge" />
    <meta property="og:description" content="Digital platform connecting villagers with government services. Track crop prices, file complaints with auto-escalation, and check eligibility for government schemes." />

    <!-- ═══════════════════════════════════════════════════
         SECURITY HEADERS (client-side defence-in-depth)
         Primary enforcement must be done at the web server
         (Nginx / Apache / Firebase Hosting / Vercel etc.)
         ═══════════════════════════════════════════════════ -->

    <!-- 1. Content Security Policy — restrict script / style / image sources -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-inline' 'unsafe-eval';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src     'self' data: https://images.unsplash.com https://upload.wikimedia.org;
        font-src    'self' data: https://fonts.gstatic.com;
        connect-src 'self' ws: wss: http: https:;
        frame-src   https://www.youtube.com https://youtube.com;
        object-src  'none';
        base-uri    'self';
        form-action 'self';
      " />

    <!-- 2. Anti-Clickjacking — deny embedding in iframes -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- 3. MIME-type sniffing protection -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- 4. Referrer policy — don't leak URL in referrer headers -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- 5. Permissions policy — disable unnecessary browser APIs (mic kept allowed for voice feature) -->
    <meta http-equiv="Permissions-Policy"
      content="camera=(), geolocation=(), payment=()" />

    <!-- 6. Cache-Control — allow browser to cache static assets for faster loads -->
    <meta http-equiv="Cache-Control" content="max-age=0, must-revalidate" />
  </head>
  <body>
    <!-- Instant loading splash — visible before React JS bundle loads -->
    <div id="gs-splash" style="
      position:fixed; inset:0; z-index:99999;
      background:linear-gradient(135deg,#f0fdf4 0%,#f8fafc 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:'Inter',system-ui,sans-serif; gap:20px;
      pointer-events:none;
    ">
      <!-- Logo -->
      <div style="
        width:64px; height:64px; border-radius:16px;
        background:linear-gradient(135deg,#16a34a,#15803d);
        display:flex; align-items:center; justify-content:center;
        box-shadow:0 8px 24px rgba(22,163,74,0.35);
        font-size:1.6rem; font-weight:900; color:#fff;
        animation:gs-pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
      ">GS</div>

      <!-- App name -->
      <div style="text-align:center; animation:gs-fade 0.5s 0.2s ease both;">
        <div style="font-size:1.6rem; font-weight:800; color:#16a34a; letter-spacing:-0.02em;">ಗ್ರಾಮಸೇತು</div>
        <div style="font-size:0.85rem; color:#64748b; font-weight:600; margin-top:4px;">ಗ್ರಾಮೀಣ ಸೇತು ಕರ್ನಾಟಕ</div>
      </div>

      <!-- Spinner -->
      <div style="
        width:36px; height:36px;
        border:3px solid rgba(22,163,74,0.2);
        border-top-color:#16a34a;
        border-radius:50%;
        animation:gs-spin 0.75s linear infinite;
      "></div>

      <div style="font-size:0.8rem; color:#94a3b8; animation:gs-fade 0.5s 0.4s ease both;">
        ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ ತೆರೆಯಲಾಗುತ್ತಿದೆ...
      </div>

      <style>
        @keyframes gs-spin  { to { transform:rotate(360deg); } }
        @keyframes gs-pop   { from { transform:scale(0.6); opacity:0; } to { transform:scale(1); opacity:1; } }
        @keyframes gs-fade  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Remove splash immediately as soon as React or DOM is ready -->
    <script>
      (function() {
        var splash = document.getElementById('gs-splash');
        if (!splash) return;
        var hide = function() {
          if (!splash) return;
          splash.style.opacity = '0';
          splash.style.transition = 'opacity 0.15s ease';
          setTimeout(function() { splash && splash.remove(); }, 150);
        };
        if (document.readyState === 'complete' || (document.getElementById('root') && document.getElementById('root').childElementCount > 0)) {
          hide();
        } else {
          window.addEventListener('DOMContentLoaded', hide);
          window.addEventListener('load', hide);
          setTimeout(hide, 400);
        }
      })();
    </script>
  </body>
</html>
