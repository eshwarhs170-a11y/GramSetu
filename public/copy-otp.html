<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copying OTP...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0fdf4;
      color: #15803d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid #bbf7d0;
      max-width: 90%;
      width: 360px;
    }
    h1 {
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 10px;
      color: #166534;
    }
    p {
      color: #166534;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .otp {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 5px;
      background: #f0fdf4;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px dashed #4ade80;
      display: inline-block;
      margin-bottom: 20px;
      color: #15803d;
      font-family: monospace;
    }
    .status {
      font-weight: 600;
      font-size: 14px;
      background: #16a34a;
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 2px 4px rgba(22, 163, 74, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GramSetu Login</h1>
    <p>Copying OTP to your clipboard...</p>
    <div class="otp" id="otp-display">- - - - - -</div>
    <div>
      <div class="status" id="status-message">Copying...</div>
    </div>
  </div>

  <script>
    // Get OTP from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const otp = urlParams.get('otp');

    if (otp) {
      document.getElementById('otp-display').innerText = otp;
      
      // Attempt to copy to clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(otp).then(() => {
          document.getElementById('status-message').innerText = '✓ Copied to Clipboard!';
          // Automatically close tab after 1.5 seconds if opened as popup
          setTimeout(() => {
            window.close();
          }, 1500);
        }).catch((err) => {
          fallbackCopy(otp);
        });
      } else {
        fallbackCopy(otp);
      }
    } else {
      document.getElementById('status-message').innerText = 'No OTP found in URL';
    }

    function fallbackCopy(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      // Prevent scrolling to bottom
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.position = "fixed";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          document.getElementById('status-message').innerText = '✓ Copied to Clipboard!';
        } else {
          document.getElementById('status-message').innerText = 'Please select and copy manually';
        }
      } catch (err) {
        document.getElementById('status-message').innerText = 'Please select and copy manually';
      }
      document.body.removeChild(textArea);
      setTimeout(() => {
        window.close();
      }, 1500);
    }
  </script>
</body>
</html>
